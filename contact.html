<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <!--
        Menu Bar
    -->

    <nav class="navbar" aria-label="Main">
        <a class="logo" href="index.html">Max Crothers</a>
    
        <input type="checkbox" id="menu-toggle" class="toggle" aria-label="Toggle menu">
        <label for="menu-toggle" class="burger" aria-hidden="true">
          <span></span><span></span><span></span>
        </label>
    
        <ul class="menu">
          <li><a href="index.html">Home</a></li>
          <li class="has-dropdown">
                <input type="checkbox" id="portfolio-toggle" class="sub-toggle" aria-label="Show portfolio pages">
                <a href="cinematography.html" class="portfolio-link ">Portfolio</a>
                <label for="portfolio-toggle" class="portfolio-label ">Portfolio</label>
                <ul class="dropdown">
                  <li><a href="cinematography.html">Cinematography</a></li>
                  <li><a href="photography.html">Photography</a></li>
                </ul>
              </li>
          <li><a href="index.html#about">About me</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>

      <!--
        Contact Form
      -->
      <div class="contact-form">
        <form action="https://api.web3forms.com/submit" method="POST" autocomplete="on">
            <input type="hidden" name="access_key" value="40edd99c-5668-4c21-a4bc-02ecb37ada30">

            <label for="fname">First Name</label>
            <input type="text" id="fname" name="firstname" placeholder="Your name..">
        
            <label for="lname">Last Name</label>
            <input type="text" id="lname" name="lastname" placeholder="Your last name..">

            <label for="lname">E-Mail Adress</label>
            <input type="text" id="lname" name="lastname" placeholder="Enter your E-Mail..">
        
            <label for="subject">Subject</label>
            <select id="subject" name="subject">
              <option value="cinematography">Cinematography</option>
              <option value="photography">Photography</option>
              <option value="colour grading">Colour Grading</option>
              <option value="other">Other</option>
            </select>
        
            <label for="content">Content</label>
            <textarea id="content" name="content" placeholder="Write something.." style="height:200px"></textarea>
        
            <input type="submit" value="Submit">
        
          </form>
      </div>
      
    
</body>
</html>
