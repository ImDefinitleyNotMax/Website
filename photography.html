  <div class="film-header">

  <div class="digital-header">
    <h2>Digital Photography</h2>
    <div id="digital-gallery"></div> <!-- Changed from class to id -->
  </div>
  
  <script>
    fetch('/data/galleries.json')
      .then(response => response.json())
      .then(data => {
        // Helper function to render a gallery into a specific container element
        function renderGallery(items, containerId) {
          const container = document.getElementById(containerId);
          if (!container) return;
          
          container.innerHTML = ''; // Clear existing content
          const mediaList = items || [];
  
          mediaList.forEach(filePath => {
  const isVideo = /\.(mp4|webm|mov)$/i.test(filePath);
  if (isVideo) {
    container.innerHTML += `
      <div class="gallery-item">
        <video src="${filePath}" controls playsinline></video>
      </div>`;
  } else {
    container.innerHTML += `
      <div class="gallery-item">
        <img src="${filePath}" alt="Gallery image" loading="lazy">
      </div>`;
  }
});
        }
  
        // Render both sections using the correct JSON property names
        renderGallery(data.film_work, 'film-gallery');
        renderGallery(data.digital_work, 'digital-gallery');
      });
  </script>
  </div>
